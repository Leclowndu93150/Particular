plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-${minecraft_version}-Fabric"
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {

    implementation "com.electronwill.night-config:core:3.8.3"
    implementation "com.electronwill.night-config:toml:3.8.3"
    implementation "com.electronwill.night-config:json:3.8.3"
    implementation "com.electronwill.night-config:hocon:3.8.3"
    implementation "com.electronwill.night-config:yaml:3.8.3"

    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "curse.maven:forge-config-api-port-fabric-547434:7081288"
    modCompileOnly "curse.maven:irisshaders-455508:7050301"
    modCompileOnly "curse.maven:sodium-394468:7048978"
    modImplementation("com.terraformersmc:modmenu:${modmenu_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
